# Codecov repository configuration: https://docs.codecov.com/docs/codecov-yaml
codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "70...100"
  status:
    # Quality gate: the project coverage must stay at 80 % or more.
    project:
      default:
        target: 80%
        threshold: 0%
    patch:
      default:
        informational: true

comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: false

flags:
  unit:
    paths:
      - src/
    carryforward: false

ignore:
  - "src/**/*.test.ts"
  - "src/core/test-utils.ts"
  - "src/ui/test-helpers.ts"
