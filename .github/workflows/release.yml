name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Tag must be semver without "v" (e.g. 1.0.0)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a semver version like 1.0.0 (no 'v' prefix)."
            exit 1
          fi

  ci:
    needs: check-tag
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.event.release.tag_name }}
      upload-pages-artifact: true

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
